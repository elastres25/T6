<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1B2A4A" />
<title>The Bible Hunt</title>
<style>
  /* ============================================================
     PALETTE (matches teacher's deck)
     navy #1B2A4A · gold #B08D3F · cream #F4F1E8 · warm grey #5A5A5A
     ============================================================ */
  :root{
    --navy:#1B2A4A;
    --gold:#B08D3F;
    --gold-light:#d4b878;
    --cream:#F4F1E8;
    --grey:#5A5A5A;
    --white:#ffffff;
    --wrong:#a94442;
    --serif:Georgia,'Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Calibri,Roboto,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--cream);
    color:var(--navy);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Header ---------- */
  header{
    background:var(--navy);
    color:var(--cream);
    padding:14px 16px 12px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    position:sticky;top:0;z-index:10;
  }
  header .brand{
    font-family:var(--serif);
    font-size:15px;
    letter-spacing:.5px;
    margin:0;
    font-weight:600;
  }
  header .sub{
    font-size:12px;
    color:var(--gold-light);
    margin-top:2px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  /* progress dots */
  .dots{
    display:flex;
    justify-content:center;
    gap:9px;
    margin-top:10px;
  }
  .dot{
    width:12px;height:12px;border-radius:50%;
    background:rgba(244,241,232,.25);
    border:1.5px solid rgba(244,241,232,.5);
    transition:all .25s ease;
  }
  .dot.done{background:var(--gold);border-color:var(--gold);}
  .dot.current{background:var(--gold-light);border-color:var(--gold-light);transform:scale(1.25);}

  /* ---------- Main / cards ---------- */
  main{
    flex:1;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:18px 16px 40px;
  }
  .card{
    background:var(--white);
    width:100%;
    max-width:440px;
    border-radius:16px;
    padding:24px 20px 26px;
    box-shadow:0 6px 20px rgba(27,42,74,.12);
    border-top:5px solid var(--gold);
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .station-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--gold);
    font-weight:700;
    margin-bottom:4px;
  }
  h2.figure{
    font-family:var(--serif);
    font-size:26px;
    margin:0 0 14px;
    color:var(--navy);
  }
  .ref{
    font-family:var(--serif);
    font-size:20px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 6px;
  }
  .context{
    color:var(--grey);
    font-size:15px;
    margin:0 0 18px;
    font-style:italic;
  }

  .showbie{
    background:var(--cream);
    border-left:4px solid var(--gold);
    border-radius:8px;
    padding:11px 13px;
    font-size:13.5px;
    color:var(--grey);
    margin-bottom:20px;
  }
  .showbie strong{color:var(--navy);}

  .prompt{
    font-size:16px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--navy);
  }

  /* ---------- Inputs & buttons ---------- */
  input[type=text]{
    width:100%;
    padding:15px 14px;
    font-size:17px;
    border:2px solid #d8d2c2;
    border-radius:10px;
    background:var(--cream);
    color:var(--navy);
    font-family:var(--sans);
    margin-bottom:14px;
  }
  input[type=text]:focus{outline:none;border-color:var(--gold);}

  button{
    font-family:var(--sans);
    cursor:pointer;
    border:none;
    border-radius:10px;
    font-size:16px;
  }
  .btn-primary{
    width:100%;
    padding:15px;
    background:var(--gold);
    color:var(--white);
    font-weight:700;
    letter-spacing:.3px;
    box-shadow:0 3px 0 #8f7132;
    transition:transform .05s ease;
  }
  .btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #8f7132;}

  /* ACTS options */
  .options{display:flex;flex-direction:column;gap:11px;margin-bottom:6px;}
  .opt{
    width:100%;
    text-align:left;
    padding:15px 16px;
    background:var(--cream);
    color:var(--navy);
    border:2px solid #d8d2c2;
    font-weight:600;
    transition:all .12s ease;
  }
  .opt:active{transform:scale(.99);}
  .opt.picked-wrong{
    border-color:var(--wrong);
    animation:shake .4s;
  }
  .opt.picked-right{
    border-color:var(--gold);
    background:var(--gold);
    color:#fff;
  }

  /* feedback */
  .feedback{
    min-height:22px;
    font-size:14.5px;
    margin-top:6px;
    font-weight:600;
  }
  .feedback.bad{color:var(--wrong);}
  .feedback.good{color:var(--gold);}

  .shake{animation:shake .4s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-7px);}
    40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(5px);}
  }
  .gold-flash{animation:goldFlash .5s ease;}
  @keyframes goldFlash{
    0%{box-shadow:0 6px 20px rgba(27,42,74,.12);}
    50%{box-shadow:0 0 0 4px var(--gold-light),0 6px 24px rgba(176,141,63,.5);}
    100%{box-shadow:0 6px 20px rgba(27,42,74,.12);}
  }

  /* step reveal */
  .step{display:none;}
  .step.active{display:block;}

  .step-tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:8px;
    border:1px solid var(--gold);
    border-radius:20px;
    padding:2px 10px;
  }

  /* locked screen */
  .locked{text-align:center;padding:20px 10px;}
  .locked .lock{font-size:54px;margin-bottom:10px;}
  .locked p{color:var(--grey);font-size:16px;}

  /* ---------- Start & completion screens ---------- */
  .center{text-align:center;}
  .big-serif{font-family:var(--serif);font-size:30px;margin:0 0 10px;color:var(--navy);}
  .intro-icon{font-size:52px;margin-bottom:8px;}
  .lead{color:var(--grey);font-size:15.5px;margin-bottom:22px;}

  .summary{
    list-style:none;
    padding:0;margin:20px 0 0;
    text-align:left;
    border-top:1px solid #e3ddce;
  }
  .summary li{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:11px 4px;
    border-bottom:1px solid #e3ddce;
    font-size:15px;
  }
  .summary .who{font-family:var(--serif);font-weight:700;}
  .summary .type{color:var(--gold);font-weight:700;font-size:13.5px;text-align:right;}

  .timer-badge{
    display:inline-block;
    background:var(--navy);
    color:var(--gold-light);
    font-family:var(--serif);
    font-size:15px;
    padding:6px 16px;
    border-radius:20px;
    margin:6px 0 4px;
  }
  .finish-name{
    font-family:var(--serif);
    font-size:20px;
    color:var(--gold);
    margin:4px 0 12px;
  }
  .closing{
    background:var(--cream);
    border-radius:10px;
    padding:14px;
    font-size:14.5px;
    color:var(--grey);
    margin-top:18px;
    font-style:italic;
  }

  /* reset control (hidden, long-press) */
  #resetZone{
    position:fixed;
    bottom:0;left:0;
    width:64px;height:64px;
    z-index:50;
    /* invisible tap/long-press target */
  }
  #resetBtn{
    position:fixed;
    bottom:14px;left:50%;
    transform:translateX(-50%);
    background:var(--navy);
    color:var(--cream);
    padding:12px 20px;
    border-radius:24px;
    box-shadow:0 4px 14px rgba(0,0,0,.3);
    display:none;
    z-index:60;
    font-size:15px;
  }
  #resetBtn.show{display:block;animation:fadeIn .2s ease;}

  footer{
    text-align:center;
    font-size:11px;
    color:#b9b09a;
    padding:6px 0 10px;
  }

  /* confetti canvas */
  #confetti{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:40;
    display:none;
  }
</style>
</head>
<body>

<!-- ==================================================================
     STATION DATA  — teacher edits here, no logic below needs touching.
     ⚠ VERIFY each gateWord against the class RSV-2CE Bible before use.
     gateWord matching = lowercase + trim + strip surrounding punctuation.
     correct (ACTS) may be a string OR an array of accepted strings.
     ================================================================== -->
<script>
const STATIONS = [
  {
    figure:"Abraham",
    ref:"Genesis 22:1–2",
    context:"God calls, and Abraham answers, “Here am I.”",
    gatePrompt:"What is the name of the son God asks Abraham to offer?",
    gateWord:"Isaac",
    actsPrompt:"Abraham answers God with total readiness and obeys in reverence. What type of prayer?",
    options:["Adoration","Contrition","Thanksgiving","Supplication"],
    correct:"Adoration"
  },
  {
    figure:"Moses",
    ref:"Exodus 32:11–14",
    context:"The people have sinned. Moses begs God to spare them.",
    gatePrompt:"Moses reminds God He brought the people out of what land?",
    gateWord:"Egypt",
    actsPrompt:"Moses pleads to God on behalf of the people. What type?",
    options:["Adoration","Contrition","Thanksgiving","Supplication"],
    correct:"Supplication"
  },
  {
    figure:"David",
    ref:"Psalm 51:1–4",
    context:"David has sinned, and cries out to God.",
    gatePrompt:"What does David ask God to have on him in the first line?",
    gateWord:"mercy",
    actsPrompt:"David is deeply sorry and begs forgiveness. What type?",
    options:["Adoration","Contrition","Thanksgiving","Supplication"],
    correct:"Contrition"
  },
  {
    figure:"Jonah",
    keystone:true,
    ref:"Jonah 2:1–2, 9",
    context:"Jonah prays from inside the great fish.",
    gatePrompt:"In verse 9, “Deliverance belongs to the ____.”",
    gateWord:"Lord",
    actsPrompt:"Jonah cries out to be rescued AND thanks God before he’s freed. What TWO types?",
    options:["Adoration + Contrition","Thanksgiving + Supplication","Contrition + Adoration","Adoration + Thanksgiving"],
    correct:"Thanksgiving + Supplication"
  },
  {
    figure:"The Shema",
    ref:"Deuteronomy 6:4–5",
    context:"The prayer Israel prayed every single day.",
    gatePrompt:"“Hear, O Israel: the Lord our God, the Lord is ____.”",
    gateWord:"one",
    actsPrompt:"The Shema commands Israel to LOVE God with all their heart, soul, and might. Which is it closest to?",
    options:["Adoration","Contrition","Thanksgiving","Supplication","It doesn’t fit neatly"],
    correct:["Adoration","It doesn’t fit neatly"],
    afterNote:"Great — hang onto that. We’ll watch the Shema together and figure out what it really is."
  }
];
</script>

<header>
  <p class="brand">Prayer &middot; Unit 2 &middot; The Bible Hunt</p>
  <p class="sub" id="progressText">Station 1 of 5</p>
  <div class="dots" id="dots"></div>
</header>

<main id="app"><!-- rendered by JS --></main>

<footer>Photos &amp; justifications go in Showbie.</footer>

<!-- hidden long-press reset target (bottom-left corner) -->
<div id="resetZone" title=""></div>
<button id="resetBtn">Reset the hunt &amp; start over</button>

<canvas id="confetti"></canvas>

<script>
/* ============================================================
   LOGIC  (teacher normally doesn't need to touch below here)
   ============================================================ */
const LS_KEY = "bibleHunt_v1";
const TOTAL = STATIONS.length;

// ---- state ----
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { started:false, name:"", current:0, gatePassed:false, startTime:null, endTime:null };
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();

// ---- gate-word normaliser: lowercase + trim + strip surrounding punctuation ----
function normalise(str){
  return String(str)
    .toLowerCase()
    .trim()
    .replace(/^[\s.,;:!?"'‘’“”()\-]+/, "")
    .replace(/[\s.,;:!?"'‘’“”()\-]+$/, "")
    .trim();
}

// ---- ACTS answer check (supports single value or array) ----
function isActsCorrect(station, choice){
  const c = station.correct;
  if(Array.isArray(c)) return c.some(v => v === choice);
  return c === choice;
}

// ---- header / progress ----
function renderProgress(){
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  for(let i=0;i<TOTAL;i++){
    const d = document.createElement("div");
    d.className = "dot";
    if(i < state.current) d.classList.add("done");
    else if(i === state.current && state.started && !allDone()) d.classList.add("current");
    dots.appendChild(d);
  }
  const pt = document.getElementById("progressText");
  if(allDone()) pt.textContent = "Complete — all 5 found";
  else if(!state.started) pt.textContent = "The Bible Hunt";
  else pt.textContent = "Station " + (state.current+1) + " of " + TOTAL;
}

function allDone(){ return state.current >= TOTAL; }

// ============================================================
//  SCREENS
// ============================================================
function render(){
  renderProgress();
  const app = document.getElementById("app");

  if(!state.started){ app.innerHTML = ""; app.appendChild(startScreen()); return; }
  if(allDone()){ app.innerHTML = ""; app.appendChild(completionScreen()); fireConfetti(); return; }

  app.innerHTML = "";
  app.appendChild(stationScreen(state.current));
}

// ---------- START ----------
function startScreen(){
  const card = document.createElement("div");
  card.className = "card center";
  card.innerHTML = `
    <div class="intro-icon">📖</div>
    <h1 class="big-serif">The Bible Hunt</h1>
    <p class="lead">Five people. Five prayers. Find each verse, prove you found it, and name the prayer. Complete one to unlock the next.</p>
    <input type="text" id="nameInput" placeholder="Your name (optional)" autocomplete="off" />
    <button class="btn-primary" id="startBtn">Begin the hunt</button>
  `;
  card.querySelector("#startBtn").addEventListener("click", ()=>{
    const nm = card.querySelector("#nameInput").value.trim();
    state.name = nm;
    state.started = true;
    state.current = 0;
    state.gatePassed = false;
    state.startTime = Date.now();
    state.endTime = null;
    saveState();
    render();
  });
  return card;
}

// ---------- STATION ----------
function stationScreen(idx){
  const s = STATIONS[idx];
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="station-label">Station ${idx+1} of ${TOTAL}${s.keystone?" &middot; Keystone":""}</div>
    <h2 class="figure">${s.figure}</h2>

    <!-- STEP 1+2+3 : task, showbie, gate word -->
    <div class="step ${state.gatePassed?'':'active'}" id="gateStep">
      <p class="ref">${s.ref}</p>
      <p class="context">${s.context}</p>
      <div class="showbie"><strong>Showbie:</strong> Post a photo of your open Bible + your justification to Showbie.</div>
      <span class="step-tag">Gate word</span>
      <p class="prompt">${s.gatePrompt}</p>
      <input type="text" id="gateInput" placeholder="Type the word…" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button class="btn-primary" id="gateBtn">Check</button>
      <div class="feedback" id="gateFeedback"></div>
    </div>

    <!-- STEP 4 : ACTS choice -->
    <div class="step ${state.gatePassed?'active':''}" id="actsStep">
      <span class="step-tag">Name the prayer</span>
      <p class="prompt">${s.actsPrompt}</p>
      <div class="options" id="actsOptions"></div>
      <div class="feedback" id="actsFeedback"></div>
    </div>
  `;

  // --- gate handlers ---
  const gateInput = card.querySelector("#gateInput");
  const gateFeedback = card.querySelector("#gateFeedback");
  function submitGate(){
    const val = normalise(gateInput.value);
    if(!val){ return; }
    if(val === normalise(s.gateWord)){
      state.gatePassed = true;
      saveState();
      card.classList.add("gold-flash");
      gateFeedback.textContent = "✓ Found it.";
      gateFeedback.className = "feedback good";
      setTimeout(()=>{
        card.querySelector("#gateStep").classList.remove("active");
        card.querySelector("#actsStep").classList.add("active");
      }, 450);
    }else{
      gateFeedback.textContent = "Not quite — check the verse again.";
      gateFeedback.className = "feedback bad";
      gateInput.classList.add("shake");
      setTimeout(()=>gateInput.classList.remove("shake"), 400);
    }
  }
  card.querySelector("#gateBtn").addEventListener("click", submitGate);
  gateInput.addEventListener("keydown", e=>{ if(e.key==="Enter") submitGate(); });

  // --- ACTS options ---
  const optWrap = card.querySelector("#actsOptions");
  const actsFeedback = card.querySelector("#actsFeedback");
  s.options.forEach(opt=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = opt;
    b.addEventListener("click", ()=>{
      if(isActsCorrect(s, opt)){
        b.classList.add("picked-right");
        actsFeedback.textContent = "✓ Yes.";
        actsFeedback.className = "feedback good";
        card.classList.add("gold-flash");
        // disable further taps
        optWrap.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        setTimeout(()=>{
          state.current += 1;
          state.gatePassed = false;
          if(allDone()){ state.endTime = Date.now(); }
          saveState();
          render();
        }, 650);
      }else{
        b.classList.add("picked-wrong");
        actsFeedback.textContent = "Think about what this person is doing — try again.";
        actsFeedback.className = "feedback bad";
        setTimeout(()=>b.classList.remove("picked-wrong"), 450);
      }
    });
    optWrap.appendChild(b);
  });

  // autofocus gate input when it's the active step
  if(!state.gatePassed){ setTimeout(()=>gateInput.focus(), 100); }

  return card;
}

// ---------- COMPLETION ----------
function fmtTime(ms){
  if(!ms || ms < 0) return "";
  const total = Math.floor(ms/1000);
  const m = Math.floor(total/60);
  const s = total % 60;
  return m + "m " + (s<10?"0":"") + s + "s";
}
function typeLabel(st){
  return Array.isArray(st.correct) ? st.correct.join(" / ") : st.correct;
}
function completionScreen(){
  const card = document.createElement("div");
  card.className = "card center";

  const elapsed = (state.startTime && state.endTime) ? fmtTime(state.endTime - state.startTime) : "";
  const keystone = STATIONS.find(s=>s.keystone);
  const afterNote = keystone && keystone.afterNote ? keystone.afterNote : "";

  let summary = "";
  STATIONS.forEach(s=>{
    summary += `<li><span class="who">${s.figure}</span><span class="type">${typeLabel(s)}</span></li>`;
  });

  card.innerHTML = `
    <div class="intro-icon">✨</div>
    <h1 class="big-serif">You found them all.</h1>
    ${state.name?`<div class="finish-name">${state.name}</div>`:""}
    ${elapsed?`<div class="timer-badge">Time: ${elapsed}</div>`:""}
    <p class="lead" style="margin-top:14px;">Every one of these was a person answering a God who spoke first. Post your last justification to Showbie and come back together.</p>
    <ul class="summary">${summary}</ul>
    ${afterNote?`<div class="closing">${afterNote}</div>`:""}
  `;
  return card;
}

// ============================================================
//  RESET  (hidden long-press bottom-left; teacher/student restart)
// ============================================================
(function setupReset(){
  const zone = document.getElementById("resetZone");
  const btn  = document.getElementById("resetBtn");
  let timer = null;

  function armShow(){
    timer = setTimeout(()=>{ btn.classList.add("show"); }, 900); // long-press ~0.9s
  }
  function cancel(){ if(timer){ clearTimeout(timer); timer=null; } }

  zone.addEventListener("touchstart", armShow, {passive:true});
  zone.addEventListener("touchend", cancel);
  zone.addEventListener("touchmove", cancel);
  zone.addEventListener("mousedown", armShow);
  zone.addEventListener("mouseup", cancel);
  zone.addEventListener("mouseleave", cancel);

  btn.addEventListener("click", ()=>{
    if(confirm("Reset the hunt and start over from the beginning?")){
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      state = loadState();
      btn.classList.remove("show");
      render();
    }
  });
  // tap elsewhere hides the reset button again
  document.addEventListener("click", (e)=>{
    if(e.target !== btn && !zone.contains(e.target)) btn.classList.remove("show");
  });
})();

// ============================================================
//  CONFETTI  (gold burst on final completion — pure canvas)
// ============================================================
let confettiDone = false;
function fireConfetti(){
  if(confettiDone) return;
  confettiDone = true;
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  canvas.style.display = "block";
  function size(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  size();
  const colors = ["#B08D3F","#d4b878","#1B2A4A","#F4F1E8","#8f7132"];
  const pieces = [];
  for(let i=0;i<120;i++){
    pieces.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.4,
      w: 6+Math.random()*6,
      h: 8+Math.random()*8,
      c: colors[Math.floor(Math.random()*colors.length)],
      vy: 2+Math.random()*3.5,
      vx: -1.5+Math.random()*3,
      rot: Math.random()*Math.PI,
      vr: -0.15+Math.random()*0.3
    });
  }
  let frames = 0;
  function tick(){
    frames++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.03;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(frames < 260){ requestAnimationFrame(tick); }
    else{ canvas.style.display="none"; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  tick();
}

// ---- go ----
render();
</script>
</body>
</html>
