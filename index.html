<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1B2A4A" />
<title>The Bible Hunt</title>
<style>
  /* ============================================================
     PALETTE (matches teacher's deck)
     navy #1B2A4A · gold #B08D3F · cream #F4F1E8 · warm grey #5A5A5A
     ============================================================ */
  :root{
    --navy:#1B2A4A;
    --gold:#B08D3F;
    --gold-light:#d4b878;
    --cream:#F4F1E8;
    --grey:#5A5A5A;
    --white:#ffffff;
    --wrong:#a94442;
    --serif:Georgia,'Times New Roman',serif;
    --sans:system-ui,-apple-system,'Segoe UI',Calibri,Roboto,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--cream);
    color:var(--navy);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Header ---------- */
  header{
    background:var(--navy);
    color:var(--cream);
    padding:14px 16px 12px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    position:sticky;top:0;z-index:10;
  }
  header .brand{
    font-family:var(--serif);
    font-size:15px;
    letter-spacing:.5px;
    margin:0;
    font-weight:600;
  }
  header .sub{
    font-size:12px;
    color:var(--gold-light);
    margin-top:2px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .dots{display:flex;justify-content:center;gap:9px;margin-top:10px;}
  .dot{
    width:12px;height:12px;border-radius:50%;
    background:rgba(244,241,232,.25);
    border:1.5px solid rgba(244,241,232,.5);
    transition:all .25s ease;
  }
  .dot.done{background:var(--gold);border-color:var(--gold);}
  .dot.current{background:var(--gold-light);border-color:var(--gold-light);transform:scale(1.25);}

  /* ---------- Main / cards ---------- */
  main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:18px 16px 40px;}
  .card{
    background:var(--white);
    width:100%;
    max-width:440px;
    border-radius:16px;
    padding:24px 20px 26px;
    box-shadow:0 6px 20px rgba(27,42,74,.12);
    border-top:5px solid var(--gold);
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .station-label{
    font-size:12px;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--gold);font-weight:700;margin-bottom:4px;
  }
  h2.figure{font-family:var(--serif);font-size:26px;margin:0 0 14px;color:var(--navy);}
  .ref{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--navy);margin:0 0 6px;}
  .context{color:var(--grey);font-size:15px;margin:0 0 18px;font-style:italic;}

  .showbie{
    background:var(--cream);border-left:4px solid var(--gold);border-radius:8px;
    padding:11px 13px;font-size:13.5px;color:var(--grey);margin-bottom:18px;
  }
  .showbie strong{color:var(--navy);}

  .prompt{font-size:16px;font-weight:600;margin:0 0 12px;color:var(--navy);}
  .field-label{font-size:13px;font-weight:700;color:var(--navy);margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px;}

  /* ---------- Inputs & buttons ---------- */
  input[type=text],textarea,select{
    width:100%;padding:14px;font-size:16px;
    border:2px solid #d8d2c2;border-radius:10px;
    background:var(--cream);color:var(--navy);
    font-family:var(--sans);margin-bottom:14px;
  }
  textarea{resize:vertical;min-height:78px;line-height:1.4;}
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);}

  button{font-family:var(--sans);cursor:pointer;border:none;border-radius:10px;font-size:16px;}
  .btn-primary{
    width:100%;padding:15px;background:var(--gold);color:var(--white);
    font-weight:700;letter-spacing:.3px;box-shadow:0 3px 0 #8f7132;transition:transform .05s ease;
  }
  .btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #8f7132;}
  .btn-primary:disabled{background:#cfc7b3;color:#fff;box-shadow:0 3px 0 #b5ad99;cursor:not-allowed;}

  /* teacher + block pickers */
  .pick-grid{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px;}
  .pick{
    flex:1 1 auto;min-width:0;padding:14px 10px;text-align:center;
    background:var(--cream);color:var(--navy);border:2px solid #d8d2c2;
    font-weight:600;border-radius:10px;
  }
  .block-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px;}
  .block-grid .pick{flex:none;padding:14px 0;font-size:17px;}
  .pick.sel{background:var(--gold);color:#fff;border-color:var(--gold);}

  /* ACTS options */
  .options{display:flex;flex-direction:column;gap:11px;margin-bottom:6px;}
  .opt{
    width:100%;text-align:left;padding:15px 16px;background:var(--cream);color:var(--navy);
    border:2px solid #d8d2c2;font-weight:600;transition:all .12s ease;
  }
  .opt:active{transform:scale(.99);}
  .opt.picked-wrong{border-color:var(--wrong);animation:shake .4s;}
  .opt.picked-right{border-color:var(--gold);background:var(--gold);color:#fff;}

  .feedback{min-height:22px;font-size:14.5px;margin-top:6px;font-weight:600;}
  .feedback.bad{color:var(--wrong);}
  .feedback.good{color:var(--gold);}

  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
  .gold-flash{animation:goldFlash .5s ease;}
  @keyframes goldFlash{0%{box-shadow:0 6px 20px rgba(27,42,74,.12);}50%{box-shadow:0 0 0 4px var(--gold-light),0 6px 24px rgba(176,141,63,.5);}100%{box-shadow:0 6px 20px rgba(27,42,74,.12);}}

  .step{display:none;}
  .step.active{display:block;}
  .step-tag{
    display:inline-block;font-size:11px;letter-spacing:1px;text-transform:uppercase;
    color:var(--gold);font-weight:700;margin-bottom:8px;border:1px solid var(--gold);
    border-radius:20px;padding:2px 10px;
  }

  /* start & completion */
  .center{text-align:center;}
  .big-serif{font-family:var(--serif);font-size:30px;margin:0 0 10px;color:var(--navy);}
  .intro-icon{font-size:52px;margin-bottom:8px;}
  .lead{color:var(--grey);font-size:15.5px;margin-bottom:22px;}

  .summary{list-style:none;padding:0;margin:20px 0 0;text-align:left;border-top:1px solid #e3ddce;}
  .summary li{display:flex;justify-content:space-between;align-items:baseline;padding:11px 4px;border-bottom:1px solid #e3ddce;font-size:15px;}
  .summary .who{font-family:var(--serif);font-weight:700;}
  .summary .type{color:var(--gold);font-weight:700;font-size:13.5px;text-align:right;}

  .timer-badge{display:inline-block;background:var(--navy);color:var(--gold-light);font-family:var(--serif);font-size:15px;padding:6px 16px;border-radius:20px;margin:6px 0 4px;}
  .finish-name{font-family:var(--serif);font-size:20px;color:var(--gold);margin:4px 0 2px;}
  .finish-meta{font-size:13px;color:var(--grey);letter-spacing:.5px;text-transform:uppercase;margin:0 0 10px;}
  .closing{background:var(--cream);border-radius:10px;padding:14px;font-size:14.5px;color:var(--grey);margin-top:18px;font-style:italic;}

  .save-status{margin-top:16px;font-size:14px;font-weight:600;min-height:20px;}
  .save-status.ok{color:var(--gold);}
  .save-status.err{color:var(--wrong);}
  .save-status.pending{color:var(--grey);}
  .btn-retry{margin-top:10px;background:var(--navy);color:var(--cream);padding:11px 18px;}

  /* reset control */
  #resetZone{position:fixed;bottom:0;left:0;width:64px;height:64px;z-index:50;}
  #resetBtn{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:var(--cream);padding:12px 20px;border-radius:24px;
    box-shadow:0 4px 14px rgba(0,0,0,.3);display:none;z-index:60;font-size:15px;
  }
  #resetBtn.show{display:block;animation:fadeIn .2s ease;}

  footer{text-align:center;font-size:11px;color:#b9b09a;padding:6px 0 10px;}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:40;display:none;}
</style>
</head>

<script>
/* -- 1) WHERE RESULTS GO ---------------------------------------------
   Paste your Google Apps Script Web App URL between the quotes.
   Leave it "" and the app still runs fully (no data is sent anywhere).
   Setup steps are in README.md.                                       */
const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycby_VsfkEnnDoVNRMGPPbl7utWOUIqf4p4QISovDt-9Dy21TfoGhJ1wDYLk9u12iafpn/exec";

/* -- 2) CLASS OPTIONS ------------------------------------------------ */
const TEACHERS = ["Lastres","Mackle","Vazquez"];
const BLOCKS   = [1,2,3,4,5,6,7,8];

/* -- 3) STATIONS ----------------------------------------------------
   ⚠ VERIFY each gateWord against the class RSV-2CE Bible before use.
   Each gateWord is a word the student must COPY straight from the verse
   (the prompt quotes the line with one word blanked out), so they can't
   answer from memory. If your RSV-2CE wording differs, edit the prompt
   and gateWord to match your Bible.
   gateWord matching = lowercase + trim + strip surrounding punctuation.
   correct (ACTS) may be a string OR an array of accepted strings.     */
const STATIONS = [
  {
    figure:"Abraham",
    ref:"Genesis 22:1–2",
    context:"God calls, and Abraham answers, “Here am I.”",
    gatePrompt:"Copy the missing word (Genesis 22:2): “…go to the land of ____, and offer him there…”",
    gateWord:"Moriah",
    actsPrompt:"Abraham answers God with total readiness and obeys in reverence. What type of prayer?",
    options:["Adoration","Contrition","Thanksgiving","Supplication"],
    correct:"Adoration"
  },
  {
    figure:"Moses",
    ref:"Exodus 32:11–14",
    context:"The people have sinned. Moses begs God to spare them.",
    gatePrompt:"Copy the missing word (Exodus 32:11): “…whom you brought forth out of the land of ____…”",
    gateWord:"Egypt",
    actsPrompt:"Moses pleads to God on behalf of the people. What type?",
    options:["Adoration","Contrition","Thanksgiving","Supplication"],
    correct:"Supplication"
  },
  {
    figure:"David",
    ref:"Psalm 51:1–4",
    context:"David has sinned, and cries out to God.",
    gatePrompt:"Copy the missing word (Psalm 51:1): “Have ____ on me, O God, according to your steadfast love…”",
    gateWord:"mercy",
    actsPrompt:"David is deeply sorry and begs forgiveness. What type?",
    options:["Adoration","Contrition","Thanksgiving","Supplication"],
    correct:"Contrition"
  },
  {
    figure:"Jonah",
    keystone:true,
    ref:"Jonah 2:1–2, 9",
    context:"Jonah prays from inside the great fish.",
    gatePrompt:"Copy the missing word (Jonah 2:9): “Deliverance belongs to the ____.”",
    gateWord:"Lord",
    actsPrompt:"Jonah cries out to be rescued AND thanks God before he’s freed. What TWO types?",
    options:["Adoration + Contrition","Thanksgiving + Supplication","Contrition + Adoration","Adoration + Thanksgiving"],
    correct:"Thanksgiving + Supplication"
  },
  {
    figure:"The Shema",
    ref:"Deuteronomy 6:4–5",
    context:"The prayer Israel prayed every single day.",
    gatePrompt:"Copy the missing word (Deuteronomy 6:4): “Hear, O Israel: the Lord our God, the Lord is ____.”",
    gateWord:"one",
    actsPrompt:"The Shema commands Israel to LOVE God with all their heart, soul, and might. Which is it closest to?",
    options:["Adoration","Contrition","Thanksgiving","Supplication","It doesn’t fit neatly"],
    correct:["Adoration","It doesn’t fit neatly"],
    afterNote:"Great — hang onto that. We’ll watch the Shema together and figure out what it really is."
  }
];
</script>

<header>
  <p class="brand">Prayer &middot; Unit 2 &middot; The Bible Hunt</p>
  <p class="sub" id="progressText">The Bible Hunt</p>
  <div class="dots" id="dots"></div>
</header>

<main id="app"><!-- rendered by JS --></main>

<footer>Photos go in Showbie &middot; your justifications are saved here.</footer>

<div id="resetZone" title=""></div>
<button id="resetBtn">Reset the hunt &amp; start over</button>
<canvas id="confetti"></canvas>

<script>
/* ============================================================
   LOGIC  (teacher normally doesn't need to touch below here)
   ============================================================ */
const LS_KEY = "bibleHunt_v2";
const TOTAL  = STATIONS.length;

function blankResults(){
  return STATIONS.map(()=>({justification:"",gateAttempts:0,actsAttempts:0,actsAnswer:""}));
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(!Array.isArray(s.results) || s.results.length!==TOTAL) s.results = blankResults();
      return s;
    }
  }catch(e){}
  return { started:false, teacher:"", block:"", name:"",
           current:0, gatePassed:false, actsPassed:false, startTime:null, endTime:null,
           results:blankResults(), submitted:false };
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
let state = loadState();

/* gate-word normaliser: lowercase + trim + strip surrounding punctuation */
function normalise(str){
  return String(str).toLowerCase().trim()
    .replace(/^[\s.,;:!?"'‘’“”()\-]+/, "")
    .replace(/[\s.,;:!?"'‘’“”()\-]+$/, "").trim();
}
function isActsCorrect(station, choice){
  const c = station.correct;
  return Array.isArray(c) ? c.some(v=>v===choice) : c===choice;
}
function allDone(){ return state.current >= TOTAL; }
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* ---------- header / progress ---------- */
function renderProgress(){
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  for(let i=0;i<TOTAL;i++){
    const d = document.createElement("div");
    d.className = "dot";
    if(i < state.current) d.classList.add("done");
    else if(i === state.current && state.started && !allDone()) d.classList.add("current");
    dots.appendChild(d);
  }
  const pt = document.getElementById("progressText");
  if(!state.started) pt.textContent = "The Bible Hunt";
  else if(allDone()) pt.textContent = "Complete — all 5 found";
  else pt.textContent = "Station " + (state.current+1) + " of " + TOTAL;
}

/* ============================================================
   SCREENS
   ============================================================ */
function render(){
  renderProgress();
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(!state.started){ app.appendChild(startScreen()); return; }
  if(allDone()){ app.appendChild(completionScreen()); fireConfetti(); maybeSubmit(); return; }
  app.appendChild(stationScreen(state.current));
}

/* ---------- START (teacher / block / name) ---------- */
function startScreen(){
  const card = document.createElement("div");
  card.className = "card";

  let teacherBtns = TEACHERS.map(t=>`<button class="pick" data-teacher="${esc(t)}">${esc(t)}</button>`).join("");
  let blockBtns   = BLOCKS.map(b=>`<button class="pick" data-block="${b}">${b}</button>`).join("");

  card.innerHTML = `
    <div class="center">
      <div class="intro-icon">📖</div>
      <h1 class="big-serif">The Bible Hunt</h1>
      <p class="lead">Five people. Five prayers. Find each verse, prove you found it, and name the prayer.</p>
    </div>
    <p class="field-label">Your teacher</p>
    <div class="pick-grid" id="teacherGrid">${teacherBtns}</div>
    <p class="field-label">Your block</p>
    <div class="block-grid" id="blockGrid">${blockBtns}</div>
    <p class="field-label">Your name</p>
    <input type="text" id="nameInput" placeholder="First and last name" autocomplete="name" />
    <button class="btn-primary" id="startBtn" disabled>Begin the hunt</button>
    <div class="feedback" id="startFeedback"></div>
  `;

  let sel = { teacher:"", block:"" };
  const startBtn = card.querySelector("#startBtn");
  const nameInput = card.querySelector("#nameInput");

  function refresh(){
    startBtn.disabled = !(sel.teacher && sel.block && nameInput.value.trim());
  }
  card.querySelector("#teacherGrid").addEventListener("click", e=>{
    const b = e.target.closest("[data-teacher]"); if(!b) return;
    sel.teacher = b.dataset.teacher;
    card.querySelectorAll("#teacherGrid .pick").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); refresh();
  });
  card.querySelector("#blockGrid").addEventListener("click", e=>{
    const b = e.target.closest("[data-block]"); if(!b) return;
    sel.block = b.dataset.block;
    card.querySelectorAll("#blockGrid .pick").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); refresh();
  });
  nameInput.addEventListener("input", refresh);

  startBtn.addEventListener("click", ()=>{
    if(startBtn.disabled) return;
    state.teacher = sel.teacher;
    state.block = sel.block;
    state.name = nameInput.value.trim();
    state.started = true;
    state.current = 0;
    state.gatePassed = false;
    state.actsPassed = false;
    state.startTime = Date.now();
    state.endTime = null;
    state.submitted = false;
    state.results = blankResults();
    saveState();
    render();
  });
  return card;
}

/* ---------- STATION ---------- */
function stationScreen(idx){
  const s = STATIONS[idx];
  const r = state.results[idx];
  const card = document.createElement("div");
  card.className = "card";
  const lastStation = (idx === TOTAL-1);

  card.innerHTML = `
    <div class="station-label">Station ${idx+1} of ${TOTAL}${s.keystone?" &middot; Keystone":""}</div>
    <h2 class="figure">${esc(s.figure)}</h2>

    <!-- STEP 1 : find & copy the gate word -->
    <div class="step ${(!state.gatePassed)?'active':''}" id="gateStep">
      <p class="ref">${esc(s.ref)}</p>
      <p class="context">${esc(s.context)}</p>
      <div class="showbie"><strong>Showbie:</strong> Post a photo of your open Bible to Showbie.</div>
      <span class="step-tag">Find it in your Bible</span>
      <p class="prompt">${esc(s.gatePrompt)}</p>
      <input type="text" id="gateInput" placeholder="Copy the word from the verse…" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button class="btn-primary" id="gateBtn">Check</button>
      <div class="feedback" id="gateFeedback"></div>
    </div>

    <!-- STEP 2 : ACTS choice -->
    <div class="step ${(state.gatePassed && !state.actsPassed)?'active':''}" id="actsStep">
      <span class="step-tag">Name the prayer</span>
      <p class="prompt">${esc(s.actsPrompt)}</p>
      <div class="options" id="actsOptions"></div>
      <div class="feedback" id="actsFeedback"></div>
    </div>

    <!-- STEP 3 : justification, then unlock next clue -->
    <div class="step ${(state.gatePassed && state.actsPassed)?'active':''}" id="justStep">
      <span class="step-tag">One more thing</span>
      <p class="prompt">In a sentence, why is this the prayer type you chose?</p>
      <textarea id="justInput" placeholder="Type your justification…">${esc(r.justification)}</textarea>
      <button class="btn-primary" id="justBtn">${lastStation?"See your results":"Unlock the next clue"}</button>
      <div class="feedback" id="justFeedback"></div>
    </div>
  `;

  const gateStep = card.querySelector("#gateStep");
  const actsStep = card.querySelector("#actsStep");
  const justStep = card.querySelector("#justStep");
  const gateInput = card.querySelector("#gateInput");
  const gateFeedback = card.querySelector("#gateFeedback");

  // --- STEP 1: gate word (copied from the verse) ---
  function submitGate(){
    const val = normalise(gateInput.value);
    if(!val) return;
    r.gateAttempts += 1;
    if(val === normalise(s.gateWord)){
      state.gatePassed = true;
      saveState();
      card.classList.add("gold-flash");
      gateFeedback.textContent = "✓ Found it.";
      gateFeedback.className = "feedback good";
      setTimeout(()=>{ gateStep.classList.remove("active"); actsStep.classList.add("active"); },450);
    }else{
      saveState();
      gateFeedback.textContent = "Not quite — check the verse and copy the word exactly.";
      gateFeedback.className = "feedback bad";
      gateInput.classList.add("shake");
      setTimeout(()=>gateInput.classList.remove("shake"),400);
    }
  }
  card.querySelector("#gateBtn").addEventListener("click", submitGate);
  gateInput.addEventListener("keydown", e=>{ if(e.key==="Enter") submitGate(); });

  // --- STEP 2: ACTS choice ---
  const optWrap = card.querySelector("#actsOptions");
  const actsFeedback = card.querySelector("#actsFeedback");
  const justInput = card.querySelector("#justInput");
  s.options.forEach(opt=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = opt;
    b.addEventListener("click", ()=>{
      r.actsAttempts += 1;
      if(isActsCorrect(s, opt)){
        r.actsAnswer = opt;
        state.actsPassed = true;
        saveState();
        b.classList.add("picked-right");
        actsFeedback.textContent = "✓ Yes.";
        actsFeedback.className = "feedback good";
        card.classList.add("gold-flash");
        optWrap.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        setTimeout(()=>{
          actsStep.classList.remove("active");
          justStep.classList.add("active");
          justInput.focus();
        },650);
      }else{
        saveState();
        b.classList.add("picked-wrong");
        actsFeedback.textContent = "Think about what this person is doing — try again.";
        actsFeedback.className = "feedback bad";
        setTimeout(()=>b.classList.remove("picked-wrong"),450);
      }
    });
    optWrap.appendChild(b);
  });

  // --- STEP 3: justification unlocks the next clue ---
  justInput.addEventListener("input", ()=>{ r.justification = justInput.value; saveState(); });
  function submitJust(){
    if(!justInput.value.trim()){
      const jf = card.querySelector("#justFeedback");
      jf.textContent = "Add your justification to unlock the next clue.";
      jf.className = "feedback bad";
      justInput.classList.add("shake");
      setTimeout(()=>justInput.classList.remove("shake"),400);
      return;
    }
    r.justification = justInput.value.trim();
    card.classList.add("gold-flash");
    setTimeout(()=>{
      state.current += 1;
      state.gatePassed = false;
      state.actsPassed = false;
      if(allDone()) state.endTime = Date.now();
      saveState();
      render();
    },350);
  }
  card.querySelector("#justBtn").addEventListener("click", submitJust);

  // focus the input for whichever step is active
  if(!state.gatePassed) setTimeout(()=>gateInput.focus(),100);
  else if(state.actsPassed) setTimeout(()=>justInput.focus(),100);
  return card;
}

/* ---------- COMPLETION ---------- */
function fmtTime(ms){
  if(!ms || ms<0) return "";
  const total = Math.floor(ms/1000);
  const m = Math.floor(total/60), s = total%60;
  return m + "m " + (s<10?"0":"") + s + "s";
}
function typeLabel(st){ return Array.isArray(st.correct) ? st.correct.join(" / ") : st.correct; }

function completionScreen(){
  const card = document.createElement("div");
  card.className = "card center";
  const elapsed = (state.startTime && state.endTime) ? fmtTime(state.endTime - state.startTime) : "";
  const keystone = STATIONS.find(s=>s.keystone);
  const afterNote = keystone && keystone.afterNote ? keystone.afterNote : "";

  let summary = "";
  STATIONS.forEach(s=>{ summary += `<li><span class="who">${esc(s.figure)}</span><span class="type">${esc(typeLabel(s))}</span></li>`; });

  card.innerHTML = `
    <div class="intro-icon">✨</div>
    <h1 class="big-serif">You found them all.</h1>
    ${state.name?`<div class="finish-name">${esc(state.name)}</div>`:""}
    <div class="finish-meta">${esc(state.teacher)} &middot; Block ${esc(state.block)}</div>
    ${elapsed?`<div class="timer-badge">Time: ${elapsed}</div>`:""}
    <p class="lead" style="margin-top:14px;">Every one of these was a person answering a God who spoke first. Post your last photo to Showbie and come back together.</p>
    <ul class="summary">${summary}</ul>
    ${afterNote?`<div class="closing">${esc(afterNote)}</div>`:""}
    <div class="save-status" id="saveStatus"></div>
  `;
  return card;
}

/* ---------- SEND RESULTS TO GOOGLE SHEET (once, at the end) ---------- */
function buildPayload(){
  return {
    teacher: state.teacher,
    block: state.block,
    name: state.name,
    totalTimeText: (state.startTime && state.endTime) ? fmtTime(state.endTime - state.startTime) : "",
    totalTimeSeconds: (state.startTime && state.endTime) ? Math.round((state.endTime - state.startTime)/1000) : "",
    stations: STATIONS.map((s,i)=>({
      figure: s.figure,
      justification: state.results[i].justification,
      gateAttempts: state.results[i].gateAttempts,
      actsAttempts: state.results[i].actsAttempts,
      actsAnswer: state.results[i].actsAnswer
    }))
  };
}
function maybeSubmit(){
  const status = document.getElementById("saveStatus");
  if(!SHEET_ENDPOINT){ if(status) status.textContent=""; return; }
  if(state.submitted){ if(status){ status.textContent="✓ Your results were saved."; status.className="save-status ok"; } return; }
  sendResults();
}
function sendResults(){
  const status = document.getElementById("saveStatus");
  if(status){ status.textContent="Saving your results…"; status.className="save-status pending"; }
  fetch(SHEET_ENDPOINT, {
    method:"POST",
    mode:"no-cors",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(buildPayload())
  }).then(()=>{
    state.submitted = true; saveState();
    if(status){ status.textContent="✓ Saved. Your teacher can see your results."; status.className="save-status ok"; }
  }).catch(()=>{
    if(status){
      status.innerHTML='Couldn’t save — check your connection.<br><button class="btn-retry" id="retryBtn">Try again</button>';
      status.className="save-status err";
      const rb = document.getElementById("retryBtn");
      if(rb) rb.addEventListener("click", sendResults);
    }
  });
}

/* ============================================================
   RESET (hidden long-press bottom-left)
   ============================================================ */
(function setupReset(){
  const zone = document.getElementById("resetZone");
  const btn  = document.getElementById("resetBtn");
  let timer = null;
  function armShow(){ timer = setTimeout(()=>btn.classList.add("show"), 900); }
  function cancel(){ if(timer){ clearTimeout(timer); timer=null; } }
  zone.addEventListener("touchstart", armShow, {passive:true});
  zone.addEventListener("touchend", cancel);
  zone.addEventListener("touchmove", cancel);
  zone.addEventListener("mousedown", armShow);
  zone.addEventListener("mouseup", cancel);
  zone.addEventListener("mouseleave", cancel);
  btn.addEventListener("click", ()=>{
    if(confirm("Reset the hunt and start over from the beginning?")){
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      state = loadState();
      btn.classList.remove("show");
      render();
    }
  });
  document.addEventListener("click",(e)=>{ if(e.target!==btn && !zone.contains(e.target)) btn.classList.remove("show"); });
})();

/* ============================================================
   CONFETTI (gold burst on final completion)
   ============================================================ */
let confettiDone = false;
function fireConfetti(){
  if(confettiDone) return; confettiDone = true;
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  canvas.style.display = "block";
  canvas.width = innerWidth; canvas.height = innerHeight;
  const colors = ["#B08D3F","#d4b878","#1B2A4A","#F4F1E8","#8f7132"];
  const pieces = [];
  for(let i=0;i<120;i++){
    pieces.push({ x:Math.random()*canvas.width, y:-20-Math.random()*canvas.height*0.4,
      w:6+Math.random()*6, h:8+Math.random()*8, c:colors[Math.floor(Math.random()*colors.length)],
      vy:2+Math.random()*3.5, vx:-1.5+Math.random()*3, rot:Math.random()*Math.PI, vr:-0.15+Math.random()*0.3 });
  }
  let frames = 0;
  function tick(){
    frames++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vy+=0.03;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if(frames<260) requestAnimationFrame(tick);
    else{ canvas.style.display="none"; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  tick();
}

render();
</script>
